<style>
/* =====================================================
   ART DIRECTION: Negocio agro-comercial premium colombiano
   Palette: Verde oscuro (marca) + dorado cálido + neutros cálidos
   Typography: Instrument Serif (display) + Plus Jakarta Sans (body)
   Density: balanced-dense (dashboard)
   ===================================================== */
:root,[data-theme="light"]{
  --color-bg:#f5f4ef;
  --color-surface:#f9f8f4;
  --color-surface-2:#fdfcfa;
  --color-surface-offset:#eeecea;
  --color-surface-offset-2:#e8e5e0;
  --color-surface-dynamic:#dedad4;
  --color-divider:#d6d2cb;
  --color-border:#ccc8c0;
  --color-text:#1e1c16;
  --color-text-muted:#6b6960;
  --color-text-faint:#b0ada6;
  --color-text-inverse:#f5f4ef;
  /* Brand: Deep Forest Green */
  --color-primary:#0f2e1a;
  --color-primary-hover:#0a2214;
  --color-primary-active:#061610;
  --color-primary-highlight:#d0ddd4;
  /* Gold accent */
  --color-gold:#b8860b;
  --color-gold-hover:#9a7009;
  --color-gold-highlight:#f6f1e8;
  /* Functional */
  --color-success:#2e6b1a;
  --color-success-highlight:#cfdecb;
  --color-warning:#9a5e0a;
  --color-warning-highlight:#f0dfbc;
  --color-error:#8b1e2e;
  --color-error-highlight:#e8c8cd;
  --color-info:#1a4a6e;
  --color-info-highlight:#c8d8e8;
  /* Radius */
  --radius-sm:0.375rem;
  --radius-md:0.5rem;
  --radius-lg:0.75rem;
  --radius-xl:1rem;
  --radius-full:9999px;
  /* Spacing */
  --space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
  --space-12:3rem;--space-16:4rem;
  /* Type */
  --text-xs:clamp(0.75rem,0.7rem + 0.25vw,0.875rem);
  --text-sm:clamp(0.875rem,0.8rem + 0.35vw,1rem);
  --text-base:clamp(1rem,0.95rem + 0.25vw,1.125rem);
  --text-lg:clamp(1.125rem,1rem + 0.75vw,1.5rem);
  --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
  /* Shadows */
  --shadow-sm:0 1px 2px oklch(0.15 0.02 140 / 0.07);
  --shadow-md:0 4px 12px oklch(0.15 0.02 140 / 0.10);
  --shadow-lg:0 12px 32px oklch(0.15 0.02 140 / 0.14);
  --transition:180ms cubic-bezier(0.16,1,0.3,1);
  --sidebar-w:240px;
  --font-display:'Instrument Serif',Georgia,serif;
  --font-body:'Plus Jakarta Sans','Helvetica Neue',sans-serif;
}
[data-theme="dark"]{
  --color-bg:#111210;
  --color-surface:#171814;
  --color-surface-2:#1c1e18;
  --color-surface-offset:#191915;
  --color-surface-offset-2:#1e201a;
  --color-surface-dynamic:#272920;
  --color-divider:#212318;
  --color-border:#2e3025;
  --color-text:#d4d2ca;
  --color-text-muted:#7a7a6e;
  --color-text-faint:#515148;
  --color-text-inverse:#1a1c14;
  --color-primary:#5a9e78;
  --color-primary-hover:#4a8a68;
  --color-primary-active:#2a5f40;
  --color-primary-highlight:#213328;
  --color-gold:#c8960c;
  --color-gold-hover:#c08820;
  --color-gold-highlight:#3a2e10;
  --color-success:#5a9e40;
  --color-success-highlight:#1e3018;
  --color-warning:#c07820;
  --color-warning-highlight:#3a2a10;
  --color-error:#c0404a;
  --color-error-highlight:#3a1820;
  --color-info:#3a70a8;
  --color-info-highlight:#182030;
  --shadow-sm:0 1px 2px oklch(0 0 0 / 0.25);
  --shadow-md:0 4px 12px oklch(0 0 0 / 0.35);
  --shadow-lg:0 12px 32px oklch(0 0 0 / 0.45);
}
@media(prefers-color-scheme:dark){:root:not([data-theme]){
  --color-bg:#111210;--color-surface:#171814;--color-surface-2:#1c1e18;
  --color-surface-offset:#191915;--color-surface-offset-2:#1e201a;
  --color-surface-dynamic:#272920;--color-divider:#212318;--color-border:#2e3025;
  --color-text:#d4d2ca;--color-text-muted:#7a7a6e;--color-text-faint:#515148;
  --color-text-inverse:#1a1c14;--color-primary:#5a9e78;--color-primary-hover:#4a8a68;
  --color-primary-active:#2a5f40;--color-primary-highlight:#213328;
  --color-gold:#c8960c;--color-gold-highlight:#3a2e10;
  --color-success:#5a9e40;--color-success-highlight:#1e3018;
  --color-warning:#c07820;--color-warning-highlight:#3a2a10;
  --color-error:#c0404a;--color-error-highlight:#3a1820;
}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth;scroll-padding-top:var(--space-16)}
body{min-height:100dvh;font-family:var(--font-body);font-size:var(--text-base);color:var(--color-text);background:var(--color-bg);line-height:1.6}
img,svg{display:block;max-width:100%}
input,button,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
table{border-collapse:collapse;width:100%}
h1,h2,h3,h4{line-height:1.15;text-wrap:balance}
p{text-wrap:pretty;max-width:72ch}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:3px;border-radius:var(--radius-sm)}
a,button,[role="button"],input,textarea,select{transition:color var(--transition),background var(--transition),border-color var(--transition),box-shadow var(--transition),opacity var(--transition)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── LAYOUT ── */
.app-shell{display:flex;min-height:100dvh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--color-primary);display:flex;flex-direction:column;z-index:100;overflow-y:auto;overflow-x:hidden;transition:transform var(--transition)}
.sidebar-logo{padding:var(--space-6) var(--space-4) var(--space-4);border-bottom:1px solid oklch(from var(--color-text-inverse) l c h / 0.12)}
.sidebar-logo-mark{display:flex;align-items:center;gap:var(--space-3)}
.sidebar-logo-mark svg{flex-shrink:0}
.sidebar-logo-name{font-family:var(--font-display);font-size:var(--text-lg);color:var(--color-text-inverse);line-height:1.1}
.sidebar-logo-name span{display:block;font-family:var(--font-body);font-size:var(--text-xs);color:oklch(from var(--color-text-inverse) l c h / 0.65);font-style:normal;letter-spacing:0.1em;text-transform:uppercase;margin-top:2px}
.sidebar-nav{flex:1;padding:var(--space-4) 0}
.nav-section-label{font-size:var(--text-xs);font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:oklch(from var(--color-text-inverse) l c h / 0.45);padding:var(--space-5) var(--space-5) var(--space-2);font-family:'Barlow Condensed',var(--font-body)}
.nav-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-5);color:oklch(from var(--color-text-inverse) l c h / 0.75);font-size:var(--text-sm);font-weight:500;text-decoration:none;border-radius:0;cursor:pointer;transition:color var(--transition),background var(--transition);position:relative;border:none;width:100%;text-align:left}
.nav-item:hover{color:var(--color-text-inverse);background:oklch(from var(--color-text-inverse) l c h / 0.10)}
.nav-item.active{color:var(--color-text-inverse);background:oklch(from var(--color-text-inverse) l c h / 0.16);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--color-gold);border-radius:0 2px 2px 0}
.nav-item i{width:18px;height:18px;flex-shrink:0}
.sidebar-footer{padding:var(--space-4);border-top:1px solid oklch(from var(--color-text-inverse) l c h / 0.12)}
.main-content{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:50;background:var(--color-surface);border-bottom:1px solid var(--color-divider);padding:0 var(--space-8);height:56px;display:flex;align-items:center;justify-content:space-between;gap:var(--space-4)}
.topbar-title{font-size:var(--text-lg);font-weight:700;color:var(--color-text);font-family:'Barlow Condensed',var(--font-body);letter-spacing:0.04em;text-transform:uppercase}
.topbar-actions{display:flex;align-items:center;gap:var(--space-3)}
.page-content{padding:var(--space-8);flex:1}

/* ── COMPONENTS ── */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:600;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:all var(--transition);white-space:nowrap;min-height:36px}
.btn-primary{background:var(--color-primary);color:var(--color-text-inverse);border-color:var(--color-primary)}
.btn-primary:hover{background:var(--color-primary-hover);border-color:var(--color-primary-hover)}
.btn-secondary{background:var(--color-surface-offset);color:var(--color-text);border-color:var(--color-border)}
.btn-secondary:hover{background:var(--color-surface-dynamic)}
.btn-ghost{background:transparent;color:var(--color-text-muted);border-color:transparent}
.btn-ghost:hover{background:var(--color-surface-offset);color:var(--color-text)}
.btn-danger{background:var(--color-error);color:#fff;border-color:var(--color-error)}
.btn-sm{padding:var(--space-1) var(--space-3);font-size:var(--text-xs);min-height:28px}
.btn-icon{padding:var(--space-2);min-width:36px;justify-content:center}

.card{background:var(--color-surface);border:1px solid oklch(from var(--color-text) l c h / 0.08);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);padding:var(--space-6)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4)}
.card-title{font-size:var(--text-base);font-weight:700;color:var(--color-text)}
.card-subtitle{font-size:var(--text-xs);color:var(--color-text-muted);margin-top:2px}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:var(--space-4);margin-bottom:var(--space-8)}
.kpi-card{background:var(--color-surface);border:1px solid oklch(from var(--color-text) l c h / 0.07);border-radius:var(--radius-xl);padding:var(--space-5);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:var(--space-2)}
.kpi-label{font-size:var(--text-xs);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-text-muted)}
.kpi-value{font-size:var(--text-xl);font-weight:800;color:var(--color-text);font-variant-numeric:tabular-nums;line-height:1}
.kpi-meta{font-size:var(--text-xs);color:var(--color-text-muted);display:flex;align-items:center;gap:var(--space-1)}
.kpi-card.primary{background:var(--color-primary);border-color:transparent}
.kpi-card.primary .kpi-label,.kpi-card.primary .kpi-meta{color:oklch(from var(--color-text-inverse) l c h / 0.7)}
.kpi-card.primary .kpi-value{color:var(--color-text-inverse)}
.kpi-card.gold{background:var(--color-gold-highlight);border-color:oklch(from var(--color-gold) l c h / 0.2)}
.kpi-card.gold .kpi-value{color:var(--color-gold)}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px var(--space-2);border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:600}
.badge-green{background:var(--color-success-highlight);color:var(--color-success)}
.badge-yellow{background:var(--color-warning-highlight);color:var(--color-warning)}
.badge-red{background:var(--color-error-highlight);color:var(--color-error)}
.badge-blue{background:var(--color-info-highlight);color:var(--color-info)}
.badge-neutral{background:var(--color-surface-offset);color:var(--color-text-muted)}

.form-group{display:flex;flex-direction:column;gap:var(--space-2);margin-bottom:var(--space-4)}
.form-label{font-size:var(--text-sm);font-weight:600;color:var(--color-text)}
.form-label span{color:var(--color-error);margin-left:2px}
.form-input,.form-select,.form-textarea{padding:var(--space-2) var(--space-3);border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:var(--text-sm);background:var(--color-surface-2);color:var(--color-text);width:100%;transition:border-color var(--transition),box-shadow var(--transition)}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-highlight)}
.form-hint{font-size:var(--text-xs);color:var(--color-text-muted)}
.form-error{font-size:var(--text-xs);color:var(--color-error)}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:var(--space-4)}
.form-textarea{resize:vertical;min-height:80px}

.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid oklch(from var(--color-text) l c h / 0.08)}
.data-table{width:100%;font-size:var(--text-sm)}
.data-table thead{background:var(--color-surface-offset)}
.data-table th{padding:var(--space-3) var(--space-4);text-align:left;font-size:var(--text-xs);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-text-muted);white-space:nowrap}
.data-table td{padding:var(--space-3) var(--space-4);border-top:1px solid oklch(from var(--color-text) l c h / 0.06);color:var(--color-text);vertical-align:middle}
.data-table tbody tr:hover{background:var(--color-surface-offset)}
.data-table .num{font-variant-numeric:tabular-nums;text-align:right}

.modal-overlay{position:fixed;inset:0;background:oklch(0.1 0.02 140 / 0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:var(--space-4);opacity:0;pointer-events:none;transition:opacity var(--transition)}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--color-surface);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:90dvh;overflow-y:auto;display:flex;flex-direction:column;transform:translateY(16px) scale(0.98);transition:transform var(--transition)}
.modal-overlay.open .modal{transform:none}
.modal-header{padding:var(--space-6) var(--space-6) var(--space-4);border-bottom:1px solid var(--color-divider);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--color-surface);z-index:1}
.modal-title{font-size:var(--text-lg);font-weight:700}
.modal-body{padding:var(--space-6)}
.modal-footer{padding:var(--space-4) var(--space-6);border-top:1px solid var(--color-divider);display:flex;gap:var(--space-3);justify-content:flex-end;position:sticky;bottom:0;background:var(--color-surface)}

.tabs{display:flex;gap:0;border-bottom:2px solid var(--color-divider);margin-bottom:var(--space-6)}
.tab-btn{padding:var(--space-3) var(--space-5);font-size:var(--text-sm);font-weight:600;color:var(--color-text-muted);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;transition:all var(--transition)}
.tab-btn:hover{color:var(--color-text)}
.tab-btn.active{color:var(--color-primary);border-bottom-color:var(--color-primary)}
.tab-panel{display:none}
.tab-panel.active{display:block}

.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:var(--space-16) var(--space-8);color:var(--color-text-muted)}
.empty-state i{width:48px;height:48px;color:var(--color-text-faint);margin-bottom:var(--space-4)}
.empty-state h3{color:var(--color-text);margin-bottom:var(--space-2);font-size:var(--text-base)}
.empty-state p{max-width:36ch;margin-bottom:var(--space-6);font-size:var(--text-sm)}

.toast-container{position:fixed;bottom:var(--space-6);right:var(--space-6);z-index:300;display:flex;flex-direction:column;gap:var(--space-2);max-width:360px}
.toast{background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);display:flex;align-items:center;gap:var(--space-3);box-shadow:var(--shadow-md);font-size:var(--text-sm);transform:translateX(120%);transition:transform var(--transition)}
.toast.show{transform:translateX(0)}
.toast-success{border-color:var(--color-success);background:var(--color-success-highlight)}
.toast-error{border-color:var(--color-error);background:var(--color-error-highlight)}

/* ── HAMBURGER MOBILE ── */
.sidebar-toggle{display:none;position:fixed;top:var(--space-4);left:var(--space-4);z-index:200;background:var(--color-primary);color:var(--color-text-inverse);padding:var(--space-2);border-radius:var(--radius-md);box-shadow:var(--shadow-md)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:oklch(0 0 0 / 0.5);z-index:90}
@media(max-width:768px){
  .sidebar-toggle{display:flex;align-items:center;justify-content:center}
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block}
  .main-content{margin-left:0}
  .topbar{padding:0 var(--space-4);padding-left:calc(var(--space-4)*3 + 36px)}
  .page-content{padding:var(--space-4)}
  .kpi-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:480px){.kpi-grid{grid-template-columns:1fr}}

/* ── THEME TOGGLE ── */
.theme-toggle{padding:var(--space-2);border-radius:var(--radius-md);color:var(--color-text-muted);background:none;border:1px solid var(--color-border)}
.theme-toggle:hover{background:var(--color-surface-offset);color:var(--color-text)}

/* ── DATE FILTER ── */
.date-filter{display:flex;align-items:center;gap:var(--space-2);background:var(--color-surface-offset);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-1) var(--space-2)}
.date-filter select,.date-filter input{background:none;border:none;font-size:var(--text-sm);color:var(--color-text);padding:var(--space-1) var(--space-1)}
.date-filter select:focus,.date-filter input:focus{outline:none}

/* ── SEARCH ── */
.search-wrap{position:relative}
.search-wrap i{position:absolute;left:var(--space-3);top:50%;transform:translateY(-50%);color:var(--color-text-faint);width:16px;height:16px;pointer-events:none}
.search-input{padding:var(--space-2) var(--space-3) var(--space-2) calc(var(--space-3)*2 + 16px);border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:var(--text-sm);background:var(--color-surface-2);color:var(--color-text);min-width:200px}
.search-input:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-highlight)}

/* ── SECTION HEADER ── */
.section-header{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-6);flex-wrap:wrap}
.section-title{font-size:var(--text-lg);font-weight:700;color:var(--color-text)}
.section-title small{display:block;font-size:var(--text-xs);font-weight:400;color:var(--color-text-muted);margin-top:2px}

/* ── CHARTS ── */
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:var(--space-6);margin-bottom:var(--space-8)}
.chart-card{background:var(--color-surface);border:1px solid oklch(from var(--color-text) l c h / 0.08);border-radius:var(--radius-xl);padding:var(--space-5);box-shadow:var(--shadow-sm)}

/* ── DIVIDER ── */
.divider{height:1px;background:var(--color-divider);margin:var(--space-4) 0}

/* ── BRAND: Barlow Condensed for display numbers and headings ── */
.kpi-value { font-family: 'Barlow Condensed', var(--font-body); font-weight: 700; letter-spacing: 0.01em; }
.sidebar-logo-name { font-family: 'Barlow Condensed', var(--font-body); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

<script>
// =====================================================
// DATA STORE (sincronizado en la nube vía Firebase Firestore)
// =====================================================
const DB = {
  productos: [
    {id:1,cat:'C',nombre:'Huevo C',mayoristaPorHuevo:333,mayoristaCubeta:10000,detalPorHuevo:350,detalCubeta:10500,activo:true},
    {id:2,cat:'B',nombre:'Huevo B',mayoristaPorHuevo:367,mayoristaCubeta:11000,detalPorHuevo:400,detalCubeta:12000,activo:true},
    {id:3,cat:'A',nombre:'Huevo A',mayoristaPorHuevo:433,mayoristaCubeta:13000,detalPorHuevo:467,detalCubeta:14000,activo:true},
    {id:4,cat:'AA',nombre:'Huevo AA',mayoristaPorHuevo:500,mayoristaCubeta:15000,detalPorHuevo:533,detalCubeta:16000,activo:true},
    {id:5,cat:'AAA',nombre:'Huevo AAA',mayoristaPorHuevo:567,mayoristaCubeta:17000,detalPorHuevo:633,detalCubeta:19000,activo:true},
    {id:6,cat:'JUMBO',nombre:'Huevo JUMBO',mayoristaPorHuevo:633,mayoristaCubeta:19000,detalPorHuevo:767,detalCubeta:23000,activo:true},
  ],
  clientes: [
    {id:1,nombre:'Tienda El Progreso',telefono:'3001234567',zona:'Centro',tipo:'mayorista',saldo:0,notas:'Cliente habitual'},
    {id:2,nombre:'Restaurante El Buen Sabor',telefono:'3109876543',zona:'Norte',tipo:'detal',saldo:45000,notas:'Paga cada 15 días'},
    {id:3,nombre:'Supermercado Familiar',telefono:'3204561234',zona:'Sur',tipo:'mayorista',saldo:0,notas:''},
  ],
  ventas: [],
  gastos: [],
  nextVentaId:1,
  nextGastoId:1,
  nextClienteId:4,
};

// =====================================================
// PERSISTENCE — Firebase Firestore (tiempo real) + export/import backup
// =====================================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAfkKGXeNQdD2QAVEAacbmPyHyvCgj9e1k",
  authDomain: "nidal-contabilidad.firebaseapp.com",
  projectId: "nidal-contabilidad",
  storageBucket: "nidal-contabilidad.firebasestorage.app",
  messagingSenderId: "364536524740",
  appId: "1:364536524740:web:ae533bec9549a33c607e91",
  measurementId: "G-JR3JEV1GTF"
};

const DOC_PATH = { collection: "nidalTrinidad", doc: "contabilidad" };

let _db = null;
let _docRef = null;
let _isRemoteUpdate = false;
let _firestoreReady = false;

function initFirebase(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    _db = firebase.firestore();
    _docRef = _db.collection(DOC_PATH.collection).doc(DOC_PATH.doc);
    _firestoreReady = true;
    _docRef.onSnapshot(snap=>{
      if(!snap.exists) return;
      const s = snap.data();
      _isRemoteUpdate = true;
      if(s.ventas) DB.ventas = s.ventas;
      if(s.gastos) DB.gastos = s.gastos;
      if(s.clientes) DB.clientes = s.clientes;
      if(s.productos) DB.productos = s.productos;
      if(s.nextVentaId) DB.nextVentaId = s.nextVentaId;
      if(s.nextGastoId) DB.nextGastoId = s.nextGastoId;
      if(s.nextClienteId) DB.nextClienteId = s.nextClienteId;
      renderPage(currentPage);
      showToast('Datos actualizados por un socio ✓','success');
      _isRemoteUpdate = false;
    }, err=>{
      console.warn('onSnapshot error', err);
      showToast('Error de sincronización: '+err.message,'error');
    });
  }catch(e){
    console.warn('initFirebase error', e);
    showToast('No se pudo conectar a la base de datos en la nube','error');
  }
}

function saveDB(){
  if(!_firestoreReady || !_docRef) return;
  if(_isRemoteUpdate) return;
  try{
    _docRef.set({
      ventas: DB.ventas, gastos: DB.gastos, clientes: DB.clientes,
      productos: DB.productos, nextVentaId: DB.nextVentaId,
      nextGastoId: DB.nextGastoId, nextClienteId: DB.nextClienteId,
      actualizadoEn: new Date().toISOString()
    }).catch(e=>{
      console.warn('saveDB error', e);
      showToast('Error al guardar en la nube: '+e.message,'error');
    });
  }catch(e){console.warn('saveDB error',e);}
}

function loadDB(){
  // Los datos se cargan de forma asíncrona vía onSnapshot en initFirebase().
  // Esta función se conserva por compatibilidad pero no hace falta llamarla directamente.
  return false;
}

function exportarDatos(){
  const snap={exportado:new Date().toISOString(),version:1,negocio:'Nidal Trinidad',
    ventas:DB.ventas,gastos:DB.gastos,clientes:DB.clientes,productos:DB.productos,
    nextVentaId:DB.nextVentaId,nextGastoId:DB.nextGastoId,nextClienteId:DB.nextClienteId};
  const blob=new Blob([JSON.stringify(snap,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='nidal-backup-'+new Date().toISOString().split('T')[0]+'.json';
  a.click();
  showToast('Backup descargado correctamente','success');
}

function importarDatos(){
  const input=document.createElement('input');
  input.type='file';input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const s=JSON.parse(ev.target.result);
        if(!s.ventas||!s.gastos) throw new Error('Archivo no válido');
        DB.ventas=s.ventas||[];DB.gastos=s.gastos||[];DB.clientes=s.clientes||[];
        if(s.productos) DB.productos=s.productos;
        DB.nextVentaId=s.nextVentaId||1;DB.nextGastoId=s.nextGastoId||1;DB.nextClienteId=s.nextClienteId||1;
        saveDB();
        showToast('Datos restaurados correctamente','success');
        renderPage(currentPage);
      }catch(err){showToast('Error al leer el archivo: '+err.message,'error');}
    };
    reader.readAsText(file);
  };
  input.click();
}

// =====================================================
// UTILS
// =====================================================
const fmt = v => new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(v);
const fmtN = v => new Intl.NumberFormat('es-CO').format(v);
const today = () => new Date().toISOString().split('T')[0];
const dateOf = s => new Date(s+'T00:00:00');

function filterByPeriod(arr, dateField){
  const p = document.getElementById('filterPeriod')?.value||'month';
  const now = new Date();
  return arr.filter(r=>{
    const d = dateOf(r[dateField]);
    if(p==='today') return r[dateField]===today();
    if(p==='week'){const w=new Date(now);w.setDate(w.getDate()-6);return d>=w}
    if(p==='month') return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
    if(p==='year') return d.getFullYear()===now.getFullYear();
    return true;
  });
}

function applyFilter(){ renderPage(currentPage); }

let currentPage='dashboard';
const pageTitles={dashboard:'Dashboard',ventas:'Ventas',gastos:'Gastos',cartera:'Cartera',clientes:'Clientes',productos:'Productos y Precios',reportes:'Reportes',config:'Configuración'};

function navigate(page, btn){
  currentPage=page;

  if(btn) btn.classList.add('active');
  document.getElementById('pageTitle').textContent=pageTitles[page]||page;
  renderPage(page);

}

function renderPage(page){
  const mc=document.getElementById('mainContent');
  mc.innerHTML='';
  const pages={dashboard:renderDashboard,ventas:renderVentas,gastos:renderGastos,cartera:renderCartera,clientes:renderClientes,productos:renderProductos,reportes:renderReportes,config:renderConfig};

// DASHBOARD
// =====================================================

  const periodLabel = labelPeriodo();
  mc.innerHTML=`

  <path d="M18 108 Q36 118 54 108" fill="none" stroke="#b8860b" stroke-width="1.1" stroke-linecap="round" opacity=".36"/>
  <ellipse cx="25" cy="89" rx="7" ry="9" fill="#f6f1e8" stroke="#b8860b" stroke-width="1.2"/>
  <ellipse cx="36" cy="85" rx="9" ry="11.5" fill="#b8860b" stroke="#0f2e1a" stroke-width="1.4"/>
  <ellipse cx="47" cy="89" rx="7" ry="9" fill="#f6f1e8" stroke="#b8860b" stroke-width="1.2"/>
  <text x="82" y="62" font-family="Barlow Condensed, sans-serif" font-weight="900" font-size="46" fill="#0f2e1a" letter-spacing="3">NIDAL</text>

  <line x1="82" y1="104" x2="430" y2="104" stroke="#b8860b" stroke-width=".8" opacity=".45"/>
  <text x="82" y="120" font-family="Barlow Condensed, sans-serif" font-weight="400" font-size="14" fill="#5a5a5a" letter-spacing="2" font-style="italic">El huevo que se distingue</text>
</svg></div>

function labelPeriodo(){
  const p=document.getElementById('filterPeriod')?.value||'month';
  return {today:'hoy',week:'esta semana',month:'este mes',year:'este año',custom:''}[p]||'';
}

function tableUltimasVentas(){
  const ultimas=DB.ventas.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,5);
  if(!ultimas.length) return '<div class="empty-state" style="padding:var(--space-8)"><p>Sin ventas registradas</p></div>';
  return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Fecha</th><th>Cliente</th><th>Cat.</th><th class="num">Total</th><th>Estado</th></tr></thead><tbody>
  ${ultimas.map(v=>`<tr><td>${v.fecha}</td><td>${v.clienteNombre}</td><td><span class="badge badge-neutral">${v.cat}</span></td><td class="num">${fmt(v.total)}</td><td>${badgeEstado(v.estado)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

function tableCartera(){
  const pendientes=DB.ventas.filter(v=>v.saldo>0).slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,5);

function badgeEstado(e){
  const map={pagado:'badge-green',fiado:'badge-yellow',parcial:'badge-yellow'};

  return `<span class="badge ${map[e]||'badge-neutral'}">${label[e]||e}</span>`;

function buildChartVentasGastos(){
  const ctx=document.getElementById('chartVentasGastos');
  if(!ctx) return;
  const now=new Date();
  const meses=[];const labMeses=[];
  for(let i=5;i>=0;i--){const d=new Date(now);d.setMonth(d.getMonth()-i);meses.push({m:d.getMonth(),y:d.getFullYear()});labMeses.push(d.toLocaleDateString('es-CO',{month:'short',year:'2-digit'}));}
  const dV=meses.map(({m,y})=>DB.ventas.filter(v=>{const d=dateOf(v.fecha);return d.getMonth()===m&&d.getFullYear()===y}).reduce((a,v)=>a+v.total,0));
  const dG=meses.map(({m,y})=>DB.gastos.filter(g=>{const d=dateOf(g.fecha);return d.getMonth()===m&&d.getFullYear()===y}).reduce((a,g)=>a+g.monto,0));
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  const gridColor=isDark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.06)';
  const textColor=isDark?'#7a7a6e':'#6b6960';
  new Chart(ctx,{type:'bar',data:{labels:labMeses,datasets:[{label:'Ventas',data:dV,backgroundColor:'rgba(26,74,46,0.8)',borderRadius:4},{label:'Gastos',data:dG,backgroundColor:'rgba(184,135,10,0.6)',borderRadius:4}]},options:{responsive:true,plugins:{legend:{labels:{color:textColor,font:{size:12}}}},scales:{x:{grid:{color:gridColor},ticks:{color:textColor}},y:{grid:{color:gridColor},ticks:{color:textColor,callback:v=>fmt(v)}}}}});
}

function buildChartCategorias(ventas){
  const ctx=document.getElementById('chartCategorias');
  if(!ctx) return;
  const cats=['C','B','A','AA','AAA','JUMBO'];
  const data=cats.map(c=>ventas.filter(v=>v.cat===c).reduce((a,v)=>a+v.total,0));
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  const textColor=isDark?'#7a7a6e':'#6b6960';
  new Chart(ctx,{type:'doughnut',data:{labels:cats,datasets:[{data,backgroundColor:['#4a7c59','#1a4a2e','#b8870a','#2e6b1a','#9a5e0a','#1a4a6e'],borderWidth:0}]},options:{responsive:true,plugins:{legend:{labels:{color:textColor,font:{size:12}}}}}});
}

function calcularVenta(){
  const prodId=parseInt(document.getElementById('vProd')?.value);
  const tipo=document.getElementById('vTipo')?.value;
  const pres=document.getElementById('vPres')?.value;
  const cant=parseFloat(document.getElementById('vCant')?.value)||0;
  const prod=DB.productos.find(p=>p.id===prodId);
  if(!prod) return;
  let pu=pres==='cubeta'?(tipo==='mayorista'?prod.mayoristaCubeta:prod.detalCubeta):(tipo==='mayorista'?prod.mayoristaPorHuevo:prod.detalPorHuevo);
  document.getElementById('vPrecioU').value=pu;
  const total=pu*cant;
  document.getElementById('vTotal').textContent=fmt(total);
}
function calcularVentaManual(){
  const pu=parseFloat(document.getElementById('vPrecioU')?.value)||0;
  const cant=parseFloat(document.getElementById('vCant')?.value)||0;
  document.getElementById('vTotal').textContent=fmt(pu*cant);
}
function toggleAbono(){
  const estado=document.getElementById('vEstado')?.value;
  const grp=document.getElementById('abonoGrp');
  if(grp) grp.style.display=estado==='parcial'?'block':'none';
}

function guardarVenta(){
  const fecha=document.getElementById('vFecha')?.value;
  const clienteId=parseInt(document.getElementById('vCliente')?.value);
  const tipo=document.getElementById('vTipo')?.value;
  const prodId=parseInt(document.getElementById('vProd')?.value);
  const pres=document.getElementById('vPres')?.value;
  const cant=parseFloat(document.getElementById('vCant')?.value)||0;
  const pu=parseFloat(document.getElementById('vPrecioU')?.value)||0;
  const metodo=document.getElementById('vMetodo')?.value;
  const estado=document.getElementById('vEstado')?.value;
  const abonoInput=parseFloat(document.getElementById('vAbono')?.value)||0;
  const notas=document.getElementById('vNotas')?.value||'';
  if(!fecha||!clienteId||!prodId||cant<=0||pu<=0){showToast('Completa todos los campos requeridos','error');return;}
  const cliente=DB.clientes.find(c=>c.id===clienteId);
  const prod=DB.productos.find(p=>p.id===prodId);
  const total=pu*cant;
  const abono=estado==='pagado'?total:estado==='fiado'?0:abonoInput;
  const saldo=total-abono;
  DB.ventas.push({id:DB.nextVentaId++,fecha,clienteId,clienteNombre:cliente.nombre,cat:prod.cat,tipo,presentacion:pres,cantidad:cant,precioUnitario:pu,total,abono,saldo,metodoPago:metodo,estado,notas});
  if(saldo>0) cliente.saldo=(cliente.saldo||0)+saldo;
  saveDB();
  closeModal();
  showToast('Venta registrada correctamente','success');
  renderPage('ventas');
}

function abonarVenta(id){
  const v=DB.ventas.find(x=>x.id===id);if(!v) return;
  document.getElementById('modalTitle').textContent='Registrar abono';
  document.getElementById('modalBody').innerHTML=`
  <p style="margin-bottom:var(--space-4)">Cliente: <strong>${v.clienteNombre}</strong><br>Saldo pendiente: <strong style="color:var(--color-warning)">${fmt(v.saldo)}</strong></p>
  <div class="form-group"><label class="form-label">Abono (COP) <span>*</span></label><input class="form-input" type="number" id="abonoMonto" min="1" max="${v.saldo}" value="${v.saldo}" placeholder="Monto a abonar"></div>
  <div class="form-group"><label class="form-label">Método</label><select class="form-select" id="abonoMetodo"><option>efectivo</option><option>transferencia</option><option>nequi</option><option>daviplata</option></select></div>`;
  document.getElementById('modalFooter').innerHTML=`<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="confirmarAbono(${id})">Confirmar abono</button>`;
  openModal();
}
function confirmarAbono(id){
  const v=DB.ventas.find(x=>x.id===id);if(!v) return;
  const monto=Math.min(parseFloat(document.getElementById('abonoMonto')?.value)||0,v.saldo);
  if(monto<=0){showToast('Ingresa un monto válido','error');return;}
  v.abono+=monto;v.saldo-=monto;
  if(v.saldo<=0){v.saldo=0;v.estado='pagado';}else{v.estado='parcial';}
  const c=DB.clientes.find(x=>x.id===v.clienteId);
  if(c) c.saldo=Math.max(0,(c.saldo||0)-monto);
  saveDB();closeModal();showToast('Abono registrado','success');renderPage('cartera');
}

function eliminarVenta(id){
  if(!confirm('¿Eliminar esta venta?')) return;
  DB.ventas=DB.ventas.filter(v=>v.id!==id);
  saveDB();
  showToast('Venta eliminada','success');renderPage('ventas');
}

function exportarCSV(){
  const ventas=filterByPeriod(DB.ventas,'fecha');
  const header=['Fecha','Cliente','Tipo','Categoría','Presentación','Cantidad','Precio Unit.','Total','Abono','Saldo','Método','Estado','Notas'];
  const rows=ventas.map(v=>[v.fecha,v.clienteNombre,v.tipo,v.cat,v.presentacion,v.cantidad,v.precioUnitario,v.total,v.abono,v.saldo,v.metodoPago,v.estado,v.notas||'']);
  const csv=[header,...rows].map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ventas-nidal-trinidad.csv';a.click();
  showToast('CSV descargado','success');
}

function showToast(msg,type='success'){
  const c=document.getElementById('toastContainer');
  const t=document.createElement('div');
  t.className=`toast toast-${type}`;
  t.innerHTML=`<i data-lucide="${type==='success'?'check-circle':'alert-circle'}" style="width:16px;height:16px;flex-shrink:0"></i>${msg}`;
  c.appendChild(t);lucide.createIcons();
  setTimeout(()=>t.classList.add('show'),10);
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},3000);
}
